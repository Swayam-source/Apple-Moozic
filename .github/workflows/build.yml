name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Universal Debug APK
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID || secrets.DISCORD_CLIENT_ID || '1350000000000000000' }}
        run: gradle :app:assembleProdDebug -Pbitchord.bundleWear=false --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/prod/debug/app-prod-universal-debug.apk
          if-no-files-found: error
